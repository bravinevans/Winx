name: Build WinX OS ISO

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize Arch keyring and install build tools
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm archiso grub git base-devel squashfs-tools libisoburn dosfstools mtools librsvg github-cli rclone go

      - name: Build Calamares and yay from AUR into local repo
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          su - builder -c "git clone https://aur.archlinux.org/calamares.git /tmp/calamares-aur && cd /tmp/calamares-aur && makepkg -s --noconfirm"
          su - builder -c "git clone https://aur.archlinux.org/yay-bin.git /tmp/yay-aur && cd /tmp/yay-aur && makepkg -s --noconfirm"
          mkdir -p /tmp/localrepo
          cp /tmp/calamares-aur/*.pkg.tar.zst /tmp/yay-aur/*.pkg.tar.zst /tmp/localrepo/
          repo-add /tmp/localrepo/localrepo.db.tar.gz /tmp/localrepo/*.pkg.tar.zst

      - name: Prepare build profile and airootfs overlay
        run: |
          cp -r /usr/share/archiso/configs/releng /tmp/build-profile
          rm -f /tmp/build-profile/airootfs/etc/mkinitcpio.conf.d/archiso.conf
          rm -f /tmp/build-profile/airootfs/etc/mkinitcpio.d/linux.preset
          cp -f profile/pacman.conf /tmp/build-profile/pacman.conf
          cp -f profile/packages.x86_64 /tmp/build-profile/packages.x86_64
          cp -f profile/profiledef.sh /tmp/build-profile/profiledef.sh
          cp -rf profile/airootfs/* /tmp/build-profile/airootfs/
          cp -f profile/airootfs/usr/share/pixmaps/winx-logo.svg /tmp/build-profile/airootfs/etc/calamares/branding/winx/winx-logo.svg
          chmod +x /tmp/build-profile/airootfs/usr/local/bin/* 2>/dev/null || true

          # Point GRUB, Syslinux, and EFI boot configs to linux-zen and rebrand to WinX OS
          sed -i 's/vmlinuz-linux\b/vmlinuz-linux-zen/g' /tmp/build-profile/grub/grub.cfg /tmp/build-profile/efiboot/loader/entries/*.conf /tmp/build-profile/syslinux/*.cfg
          sed -i 's/initramfs-linux\.img/initramfs-linux-zen.img/g' /tmp/build-profile/grub/grub.cfg /tmp/build-profile/efiboot/loader/entries/*.conf /tmp/build-profile/syslinux/*.cfg
          sed -i 's/Arch Linux/WinX OS/g' /tmp/build-profile/grub/grub.cfg /tmp/build-profile/efiboot/loader/entries/*.conf /tmp/build-profile/syslinux/*.cfg

          # Render WinX SVG logo into a non-conflicting PNG path
          rsvg-convert -w 128 -h 128 profile/airootfs/usr/share/pixmaps/winx-logo.svg -o /tmp/build-profile/airootfs/usr/share/pixmaps/winx-watermark.png

          # Overwrite Plymouth's watermark AFTER pacman installs plymouth
          cat << 'EOF' >> /tmp/build-profile/airootfs/root/customize_airootfs.sh
          cp -f /usr/share/pixmaps/winx-watermark.png /usr/share/plymouth/themes/spinner/watermark.png
          EOF

          # Enable Plymouth quiet splash in GRUB, Syslinux, and EFI boot configs
          sed -i 's/archisosearchuuid=%ARCHISO_UUID%/archisosearchuuid=%ARCHISO_UUID% quiet splash/g' /tmp/build-profile/grub/grub.cfg /tmp/build-profile/efiboot/loader/entries/*.conf /tmp/build-profile/syslinux/*.cfg

          # Enable SDDM and NetworkManager on boot
          mkdir -p /tmp/build-profile/airootfs/etc/systemd/system/multi-user.target.wants
          ln -sf /usr/lib/systemd/system/sddm.service /tmp/build-profile/airootfs/etc/systemd/system/display-manager.service
          ln -sf /usr/lib/systemd/system/NetworkManager.service /tmp/build-profile/airootfs/etc/systemd/system/multi-user.target.wants/NetworkManager.service
          mkdir -p /tmp/build-profile/airootfs/home/winx

      - name: Build ISO
        run: |
          mkdir -p /tmp/work /tmp/out
          mkarchiso -v -w /tmp/work -o /tmp/out /tmp/build-profile

      - name: Upload single full ISO to Cloudflare R2 and publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          RCLONE_CONFIG_R2_ACL: private
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: |
          ISO_FILE=$(ls /tmp/out/*.iso | head -n 1)
          ISO_NAME=$(basename "$ISO_FILE")
          TAG="v$(date +%Y.%m.%d)-${{ github.run_number }}"

          mkdir -p /tmp/release
          sha256sum "$ISO_FILE" > "/tmp/release/${ISO_NAME}.sha256"

          rclone delete "r2:winx-os" --include "*.iso" --s3-no-check-bucket || true
          rclone copyto "$ISO_FILE" "r2:winx-os/${ISO_NAME}" --s3-no-check-bucket --progress
          DIRECT_URL="${R2_PUBLIC_URL}/${ISO_NAME}"

          gh release create "$TAG" "/tmp/release/${ISO_NAME}.sha256" \
            --repo "${{ github.repository }}" \
            --title "WinX OS ($TAG)" \
            --notes "### Direct Single-File ISO Download (2.7 GB)
          - **Download ISO:** [Download ${ISO_NAME}](${DIRECT_URL})
          - **CLI Resume Download:** \`aria2c -c -x 4 -s 4 ${DIRECT_URL}\`
          - **Verify Checksum:** \`sha256sum -c ${ISO_NAME}.sha256\`"
